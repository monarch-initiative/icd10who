[project]
name = "icd10who"
version = "0.1.0"
description = "Preprocessed ICD-10 WHO source for Mondo ingest"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.0.0",
    "linkml==1.11.1",
    "linkml-owl==0.5.0",
    "linkml-runtime==1.11.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rdflib>=6.0.0",
    "requests>=2.28.0",
    "ruff>=0.8.0",
    "semsql==0.4.0",
    "sssom==0.4.17",
    "urllib3>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "src/icd10who"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
