name: Build and release

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 0 * * 1"   # weekly, Monday 00:00 UTC
  push:
    branches: [main]
    paths:
      - "Makefile"
      - "config/**"
      - "sparql/**"
      - "linkml/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore WHO API node cache
        uses: actions/cache@v4
        with:
          path: tmp/cache
          key: icd10who-api-cache-${{ hashFiles('scripts/acquire.py') }}
          restore-keys: |
            icd10who-api-cache-

      - name: Build (ROBOT + LinkML)
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          docker run --rm \
            -e ROBOT_PLUGINS_DIRECTORY=/tools/robot-plugins \
            -e CLIENT_ID="${CLIENT_ID}" \
            -e CLIENT_SECRET="${CLIENT_SECRET}" \
            -v "$PWD:/work" \
            -w /work \
            obolibrary/odkfull:v1.6 \
            bash -lc "pip3 install --break-system-packages uv && uv sync && make build-release"

      - name: Set release tag
        id: version
        run: echo "tag=v$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        if: success() && hashFiles('icd10who.yaml') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: |
            icd10who.yaml
            icd10who.owl
            icd10who.raw.ttl
            icd10who.mirror.ttl
            mirror-icd10who.owl
            icd10who.db
            reports/mirror_signature-icd10who.tsv
            reports/component_signature-icd10who.tsv
            reports/icd10who-metrics.json
            reports/source-version.tsv
            mappings/icd10who.sssom.tsv
            docs/sources/icd10who.md
            docs/metrics/icd10who.md
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
